<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>旅途手帳 ✈</title>
<!-- 引入 Leaflet 地圖的 CSS 與 JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Playfair+Display:wght@700&display=swap');

  :root {
    --ink: #1a1a2e; --paper: #faf9f6; --sand: #e8e0d0;
    --coral: #e07a5f; --sage: #7a9e9f; --gold: #c9a84c;
    --muted: #7a7a8c; --white: #ffffff; --green: #5a9e7f;
    --card-shadow: 0 2px 20px rgba(26,26,46,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Noto Sans TC', sans-serif; background: var(--paper); color: var(--ink); min-height: 100vh; overflow-x: hidden;}

  /* ── SIDEBAR ── */
  .sidebar {
    position: fixed; top: 0; left: 0; width: 260px; height: 100vh;
    background: var(--ink); display: flex; flex-direction: column;
    z-index: 1000; overflow-y: auto; transition: transform 0.3s ease;
  }
  .sidebar-logo { padding: 28px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); display: flex; justify-content: space-between; align-items: center; }
  .sidebar-logo h1 { font-family: 'Playfair Display', serif; color: var(--white); font-size: 22px; }
  .sidebar-logo p { color: var(--sage); font-size: 11px; margin-top: 4px; letter-spacing: 0.06em; text-transform: uppercase; }
  .close-sidebar-btn { display: none; background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; min-height: 44px; min-width: 44px; }
  .sidebar-section { padding: 16px 0 8px; }
  .sidebar-section-label { padding: 0 20px 8px; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.1em; }
  
  .trip-item {
    display: flex; align-items: center; padding: 10px 20px; cursor: pointer;
    transition: background 0.15s; border-left: 3px solid transparent; gap: 10px; min-height: 52px;
  }
  .trip-item:hover { background: rgba(255,255,255,0.05); }
  .trip-item.active { background: rgba(224,122,95,0.12); border-left-color: var(--coral); }
  .trip-item .trip-flag { font-size: 20px; }
  .trip-item-info { flex: 1; min-width: 0; }
  .trip-item-name { color: var(--white); font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .trip-item-dates { color: var(--muted); font-size: 11px; margin-top: 1px; }
  
  .btn-add-trip {
    margin: 12px 16px; padding: 10px; background: rgba(201,168,76,0.15);
    border: 1px dashed rgba(201,168,76,0.4); border-radius: 8px; color: var(--gold);
    font-size: 12px; cursor: pointer; text-align: center; min-height: 44px;
  }
  .sidebar-help { color: var(--muted); font-size: 11px; line-height: 1.5; padding: 0 18px 14px; }

  /* ── MAIN ── */
  .main { margin-left: 260px; min-height: 100vh; transition: margin 0.3s ease; }
  .mobile-menu-btn { display: none; background: none; border: none; color: var(--white); font-size: 24px; cursor: pointer; min-height: 44px; min-width: 44px; align-items: center; justify-content: center; }

  /* ── TRIP HERO ── */
  .trip-hero {
    background: linear-gradient(135deg, var(--ink) 0%, #2d2d4e 60%, #3a4a6b 100%);
    padding: 40px 48px 32px; position: relative; overflow: hidden;
  }
  .trip-hero-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .trip-hero h2 { font-family: 'Playfair Display', serif; color: var(--white); font-size: 32px; line-height: 1.2; }
  .trip-hero-meta { display: flex; gap: 24px; margin-top: 16px; flex-wrap: wrap; }
  .trip-hero-stat { color: rgba(255,255,255,0.6); font-size: 13px; }
  .trip-hero-stat span { color: var(--white); font-weight: 500; margin-right: 4px; }
  .btn-edit-trip { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; min-height: 44px; font-size: 12px; }
  .hero-actions { display: flex; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }

  /* ── TABS ── */
  .trip-tabs { display: flex; background: var(--white); border-bottom: 1px solid var(--sand); padding: 0 48px; position: sticky; top: 0; z-index: 10; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .trip-tab { padding: 0 20px; font-size: 14px; color: var(--muted); cursor: pointer; border: none; border-bottom: 2px solid transparent; background: none; white-space: nowrap; min-height: 48px; font-weight: 500; }
  .trip-tab.active { color: var(--coral); border-bottom-color: var(--coral); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  /* ── ITINERARY & EDITING ── */
  .itinerary-body { padding: 28px 48px 48px; max-width: 920px; }
  .itinerary-toolbar { display: flex; justify-content: flex-end; margin-bottom: 20px; }
  .btn-add-day { padding: 8px 16px; border-radius: 8px; background: var(--ink); color: var(--white); border: none; cursor: pointer; min-height: 44px; font-size: 13px; }
  
  .day-block { margin-bottom: 32px; }
  .day-header { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap;}
  .day-badge { background: var(--ink); color: var(--white); font-size: 11px; padding: 4px 12px; border-radius: 20px; }
  .day-title-wrap { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 200px; }
  .day-title { font-size: 15px; font-weight: 500; color: var(--ink); }
  .day-title-input { font-size: 15px; font-weight: 500; border: none; border-bottom: 2px solid var(--sage); background: transparent; outline: none; padding: 4px; width: 100%; }
  .day-actions { display: flex; gap: 4px; }
  
  .btn-icon { padding: 6px 10px; border-radius: 6px; border: 1px solid var(--sand); background: var(--white); color: var(--muted); cursor: pointer; font-size: 12px; min-height: 36px; }
  .btn-icon:hover { border-color: var(--coral); color: var(--coral); }

  .event-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--sand); background: var(--white); position: relative; margin-bottom: 8px; transition: box-shadow 0.2s;}
  .event-row:hover { box-shadow: var(--card-shadow); }
  .event-row-actions { display: flex; gap: 3px; position: absolute; top: 8px; right: 8px; }
  .event-time { font-size: 12px; color: var(--muted); min-width: 92px; padding-top: 2px; }
  .event-type-icon { font-size: 18px; min-width: 24px; text-align: center; }
  .event-body { flex: 1; padding-right: 60px; }
  .event-type-tag { font-size: 10px; color: var(--muted); margin-bottom: 3px; text-transform: uppercase; }
  .event-name { font-size: 14px; font-weight: 500; color: var(--ink); line-height: 1.4; }
  .event-desc { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .event-places { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .place-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; background: rgba(122,158,159,0.12); color: var(--sage); font-size: 11px; cursor: pointer; border: 1px solid rgba(122,158,159,0.25); min-height: 32px; }
  
  /* Edit Form Styles */
  .event-row.editing { border-color: var(--sage); background: #f5fafa; flex-direction: column; gap: 10px; padding: 16px; }
  .edit-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
  .edit-grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; width: 100%; }
  .edit-field label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .edit-field input, .edit-field textarea, .edit-field select { width: 100%; padding: 8px 10px; border: 1px solid var(--sand); border-radius: 7px; font-size: 13px; min-height: 40px; }
  .edit-field.full { grid-column: 1 / -1; }
  .edit-actions { display: flex; gap: 8px; justify-content: flex-end; width: 100%; margin-top: 10px; }
  .btn-save { padding: 8px 18px; border-radius: 7px; background: var(--sage); color: var(--white); border: none; cursor: pointer; min-height: 40px; }
  .btn-cancel { padding: 8px 14px; border-radius: 7px; background: transparent; border: 1px solid var(--sand); cursor: pointer; min-height: 40px; }

  .add-event-row { width: 100%; border: 1px dashed var(--sand); border-radius: 10px; padding: 12px; text-align: center; cursor: pointer; color: var(--muted); background: transparent; min-height: 44px; margin-top: 8px; }

  /* ── MAP TAB ── */
  .map-body { padding: 32px 48px; height: calc(100vh - 200px); display: flex; flex-direction: column; }
  .map-frame-wrap { border-radius: 16px; overflow: hidden; border: 1px solid var(--sand); box-shadow: var(--card-shadow); flex: 1; min-height: 400px; position: relative; }
  #main-map { width: 100%; height: 100%; z-index: 1; }

  /* ── MODALS ── */
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(26,26,46,0.7); z-index: 2000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--white); border-radius: 20px; padding: 32px; width: 90%; max-width: 500px; max-height: 90vh; overflow-y: auto; position: relative; }
  .modal h3 { font-family: 'Playfair Display', serif; font-size: 22px; margin-bottom: 16px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  .form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--sand); border-radius: 8px; font-size: 14px; }
  .form-group textarea { min-height: 260px; resize: vertical; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; line-height: 1.5; }
  .text-modal { max-width: 760px; }
  .modal-note { color: var(--muted); font-size: 12px; line-height: 1.6; margin-bottom: 14px; }
  .file-label {
    display: inline-flex; align-items: center; justify-content: center; padding: 8px 14px;
    border-radius: 7px; border: 1px solid var(--sand); cursor: pointer; min-height: 40px;
    font-size: 13px;
  }
  .file-label input { display: none; }
  .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
  
  .place-modal { background: var(--white); border-radius: 20px; width: 90%; max-width: 500px; overflow: hidden; position: relative; }
  .place-modal-header { background: var(--ink); padding: 24px; color: var(--white); }
  .place-modal-body { padding: 24px; }
  #place-modal-map { width: 100%; height: 250px; border-radius: 12px; margin-bottom: 16px; z-index: 1; }
  .btn-maps { display: flex; align-items: center; justify-content: center; padding: 12px; background: var(--coral); color: var(--white); border-radius: 8px; font-size: 14px; text-decoration: none; font-weight: 500; margin-top: 16px; }

  /* ── RWD MOBILE STYLES ── */
  @media (max-width: 768px) {
    .sidebar { transform: translateX(-100%); }
    .sidebar.open { transform: translateX(0); }
    .main { margin-left: 0; }
    .mobile-menu-btn { display: flex; }
    .close-sidebar-btn { display: block; }
    
    .trip-hero { padding: 24px 20px; }
    .trip-hero-top { align-items: center; }
    .trip-hero h2 { font-size: 24px; }
    .hero-actions { width: 100%; justify-content: stretch; }
    .hero-actions button { flex: 1 1 140px; }
    .trip-tabs { padding: 0 16px; }
    .itinerary-body { padding: 20px 16px; }
    .map-body { padding: 16px; height: calc(100vh - 150px); }
    
    .event-row { padding: 16px; }
    .event-time { font-size: 14px; font-weight: 500; color: var(--ink); width: 100%; }
    .event-type-icon { position: absolute; top: 16px; right: 40px; }
    .event-row-actions { top: 12px; right: 4px; }
    .event-body { padding-right: 0; margin-top: 8px; }
  }
</style>
</head>
<body>

<!-- SIDEBAR -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-logo">
    <div><h1>旅途手帳</h1><p>Travel Planner</p></div>
    <button class="close-sidebar-btn" onclick="toggleSidebar()">✕</button>
  </div>
  <div class="sidebar-section">
    <div class="sidebar-section-label">我的旅程</div>
    <div id="trip-list"></div>
    <button class="btn-add-trip" onclick="createTrip()">＋ 新增旅遊規劃</button>
    <div class="sidebar-help">行程會自動存在這台裝置的瀏覽器中。上傳 GitHub 後也可以用同一份網頁開啟。</div>
  </div>
</div>

<!-- MAIN -->
<div class="main">
  <div id="trip-detail"></div>
</div>

<!-- EDIT TRIP INFO MODAL -->
<div class="modal-overlay" id="modal-edit-trip">
  <div class="modal">
    <button class="close-sidebar-btn" onclick="closeModal('modal-edit-trip')" style="position:absolute;top:12px;right:12px;color:#000;display:block;">✕</button>
    <h3>編輯旅程資料</h3>
    <div class="form-group"><label>旅程名稱</label><input type="text" id="edit-trip-name"></div>
    <div style="display:flex;gap:10px;">
      <div class="form-group" style="flex:1;"><label>出發日期</label><input type="date" id="edit-trip-start"></div>
      <div class="form-group" style="flex:1;"><label>回程日期</label><input type="date" id="edit-trip-end"></div>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal('modal-edit-trip')">取消</button>
      <button class="btn-save" onclick="saveTripInfo()">儲存變更</button>
    </div>
  </div>
</div>

<!-- TEXT IMPORT / EXPORT MODAL -->
<div class="modal-overlay" id="modal-text-plan">
  <div class="modal text-modal">
    <button class="close-sidebar-btn" onclick="closeModal('modal-text-plan')" style="position:absolute;top:12px;right:12px;color:#000;display:block;">✕</button>
    <h3>用文字編輯整份行程</h3>
    <p class="modal-note">把下面 JSON 複製給 AI 修改，再貼回來按「套用文字計畫」。也可以上傳 .txt 或 .json。請保留欄位名稱，這樣地圖、時間與聯絡資訊才能自動變回畫面上的行程。</p>
    <div class="form-group">
      <label>整份旅遊規劃文字</label>
      <textarea id="text-plan-input"></textarea>
    </div>
    <div id="text-plan-status" class="modal-note"></div>
    <div class="modal-actions" style="flex-wrap:wrap;">
      <label class="file-label">上傳文字檔 <input type="file" id="text-plan-file" accept=".txt,.json,application/json,text/plain"></label>
      <button class="btn-cancel" onclick="copyTextPlan()">複製文字</button>
      <button class="btn-cancel" onclick="downloadTextPlan()">下載 JSON</button>
      <button class="btn-save" onclick="applyTextPlan()">套用文字計畫</button>
    </div>
  </div>
</div>

<!-- PLACE MODAL -->
<div class="modal-overlay" id="modal-place">
  <div class="place-modal">
    <button class="close-sidebar-btn" onclick="closePlaceModal()" style="position:absolute;top:12px;right:12px;display:block;">✕</button>
    <div class="place-modal-header">
      <div style="font-size: 12px; color: var(--sage); margin-bottom: 4px;" id="place-modal-type"></div>
      <h3 id="place-modal-name" style="font-family:'Playfair Display',serif; font-size:22px;"></h3>
    </div>
    <div class="place-modal-body">
      <div id="place-modal-map"></div>
      <div style="color:var(--muted); font-size:14px; display:flex; gap:8px;">
        <span>📍</span><span id="place-modal-address"></span>
      </div>
      <a id="place-modal-gmaps" href="#" target="_blank" class="btn-maps">在地圖應用程式中開啟 ↗</a>
    </div>
  </div>
</div>

<script>

function uid() { return Math.random().toString(36).slice(2, 9); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// ─── 完整的6天5夜行程資料 ──────────────────────────────────

      { id:uid(), time:"13:30 - 18:00", type:"購物", name:"新世界百貨 Centum City", desc:"逛累了可到 Spa Land", places:["新世界百貨 Centum City", "Spa Land 汗蒸幕"] },
      { id:uid(), time:"18:00 - 20:00", type:"餐廳", name:"西面商圈晚餐", desc:"推薦金豬食堂", places:["金豬食堂", "西面地下街"] }
    ]},
    { label:"Day 2", date:"7/25", title:"大邱一日遊", events:[
      { id:uid(), time:"08:30 - 09:20", type:"交通", name:"KTX 前往東大邱", places:["釜山站", "東大邱站"] },
      { id:uid(), time:"09:40 - 12:30", type:"景點", name:"東城路商圈・金光石路", places:["東城路商圈", "金光石路"] },
      { id:uid(), time:"12:30 - 14:00", type:"餐廳", name:"東仁洞燉排骨", places:["東仁洞燉排骨一條街"] },
      { id:uid(), time:"14:00 - 17:00", type:"景點", name:"西門市場", places:["西門市場"] },
      { id:uid(), time:"17:30 - 18:30", type:"交通", name:"KTX 返回釜山", places:["釜山站"] }

      { id:uid(), time:"09:00 - 12:00", type:"景點", name:"佛國寺", places:["佛國寺"] },
      { id:uid(), time:"12:00 - 13:30", type:"餐廳", name:"皇理團路午餐自理", places:["皇理團路"] },
      { id:uid(), time:"13:30 - 17:30", type:"景點", name:"大陵苑", places:["大陵苑"] },
      { id:uid(), time:"17:30 - 19:30", type:"景點", name:"東宮與月池（雁鴨池）", desc:"欣賞夜景", places:["東宮與月池（雁鴨池）"] }
    ]},
    { label:"Day 4", date:"7/27", title:"松島纜車與影島", events:[
      { id:uid(), time:"10:00 - 12:00", type:"景點", name:"國際市場", places:["札嘎其站", "國際市場"] },
      { id:uid(), time:"12:00 - 14:30", type:"景點", name:"松島海上纜車", places:["松島海上纜車"] },
      { id:uid(), time:"15:00 - 17:30", type:"咖啡廳", name:"P.ARK 複合式藝術咖啡廳", places:["P.ARK 咖啡廳"] },
      { id:uid(), time:"18:30 - 20:00", type:"餐廳", name:"富平洞涼拌豬腳", places:["南浦洞", "富平洞豬腳街"] }
    ]},
    { label:"Day 5", date:"7/28", title:"海雲台與廣安里夜景", events:[
      { id:uid(), time:"09:40 - 12:30", type:"景點", name:"海雲台海水浴場", places:["海雲台站", "海雲台海水浴場"] },
      { id:uid(), time:"14:15 - 17:00", type:"購物", name:"新世界百貨補逛", places:["新世界百貨 Centum City"] },
      { id:uid(), time:"17:15 - 20:30", type:"景點", name:"廣安里大橋夜景", places:["廣安站", "廣安里海水浴場", "廣安大橋"] }
    ]},
    { label:"Day 6", date:"7/29", title:"準備返家", events:[
      { id:uid(), time:"08:30 - 09:30", type:"早餐", name:"辦理退房", places:["Hotel Yuna Business"] },
      { id:uid(), time:"09:30 - 10:20", type:"交通", name:"前往金海機場", places:["沙上站", "金海國際機場"] },
      { id:uid(), time:"12:15 - 13:40", type:"航班", name:"搭機返回", places:["金海國際機場"] }
    ]}
  ]
};

const STORAGE_KEY = "travelPlannerData.v2";
let trips = [activeTrip];
let activeTripId = activeTrip.id;

// ─── 狀態與渲染 ──────────────────────────────────────────
let activeTab = 'itinerary';
let editingEventId = null;
let mainMapInstance = null;
let modalMapInstance = null;
let modalMarker = null;

loadTravelData();

function toggleSidebar() { document.getElementById('sidebar').classList.toggle('open'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }

function normalizeTrip(trip) {
  const clean = {
    id: trip.id || uid(),
    name: trip.name || "新的旅遊規劃",
    flag: trip.flag || "🌏",
    start: trip.start || "",
    end: trip.end || "",
    days: Array.isArray(trip.days) ? trip.days : []
  };
  clean.days = clean.days.map((day, index) => ({
    label: day.label || `Day ${index + 1}`,
    date: day.date || "",
    title: day.title || "新的一天",
    events: Array.isArray(day.events) ? day.events.map(event => ({
      id: event.id || uid(),
      time: event.time || "",
      type: event.type || "活動",
      name: event.name || "新行程",
      desc: event.desc || event.communication || "",
      places: Array.isArray(event.places) ? event.places : []
    })) : []
  }));
  return clean;
}

function loadTravelData() {
  try {
    const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
    if (saved && Array.isArray(saved.trips) && saved.trips.length) {
      trips = saved.trips.map(normalizeTrip);
      activeTripId = saved.activeTripId || trips[0].id;
      activeTrip = trips.find(t => t.id === activeTripId) || trips[0];
      activeTripId = activeTrip.id;
    }
  } catch (error) {
    console.warn("Could not load saved travel data", error);
  }
}

function saveTravelData() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify({ trips, activeTripId }));
}

function setActiveTrip(id) {
  activeTrip = trips.find(t => t.id === id) || trips[0];
  activeTripId = activeTrip.id;
  editingEventId = null;
  mainMapInstance = null;
  renderApp();
  if (window.innerWidth <= 768) toggleSidebar();
}

function renderApp() {
  const t = activeTrip;
  saveTravelData();
  document.getElementById('trip-list').innerHTML = trips.map(trip => `
    <div class="trip-item ${trip.id === activeTripId ? 'active' : ''}" onclick="setActiveTrip('${esc(trip.id)}')">
      <div class="trip-flag">${esc(trip.flag || '🌏')}</div>
      <div class="trip-item-info">
        <div class="trip-item-name">${esc(trip.name)}</div>
        <div class="trip-item-dates">${esc(trip.start || '未定')} → ${esc(trip.end || '未定')}</div>
      </div>
    </div>`).join('');

  document.getElementById('trip-detail').innerHTML = `
    <div class="trip-hero">
      <div class="trip-hero-top">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="mobile-menu-btn" onclick="toggleSidebar()">☰</button>
          <div>
            <div style="font-size:11px; color:var(--coral);">${esc(t.flag)} ${esc(t.start)} – ${esc(t.end)}</div>
            <h2>${esc(t.name)}</h2>
          </div>
        </div>
        <div class="hero-actions">
          <button class="btn-edit-trip" onclick="openEditTripInfo()">✏️ 編輯基本資料</button>
          <button class="btn-edit-trip" onclick="openTextPlan()">📝 文字匯入/匯出</button>
        </div>
      </div>
    </div>
    <div class="trip-tabs">
      <button class="trip-tab ${activeTab==='itinerary'?'active':''}" onclick="switchTab('itinerary')">📋 行程表</button>
      <button class="trip-tab ${activeTab==='map'?'active':''}" onclick="switchTab('map')">🗺️ 總覽地圖</button>
    </div>
    <div class="tab-content ${activeTab==='itinerary'?'active':''}" id="tab-itinerary">
      <div class="itinerary-body">
        <div class="itinerary-toolbar"><button class="btn-add-day" onclick="addDay()">＋ 新增天數</button></div>
        ${t.days.map((day, di) => `
          <div class="day-block">
            <div class="day-header">
              <div class="day-badge">${esc(day.label)}</div>
              <div class="day-title-wrap">
                <div class="day-title" id="day-title-${di}">${esc(day.date ? day.date + ' · ' : '')}${esc(day.title)}</div>
              </div>
              <div class="day-line"></div>
              <div class="day-actions">
                <button class="btn-icon" onclick="startEditDayTitle(${di})">✏️</button>
                <button class="btn-icon" onclick="deleteDay(${di})" style="color:var(--coral)">🗑️</button>
              </div>
            </div>
            <div id="events-list-${di}">
              ${day.events.map(ev => renderEventRow(ev, di)).join('')}
              <button class="add-event-row" onclick="addEvent(${di})">＋ 新增行程項目</button>
            </div>
          </div>`).join('')}
      </div>
    </div>
    <div class="tab-content ${activeTab==='map'?'active':''}" id="tab-map">
      <div class="map-body"><div class="map-frame-wrap"><div id="main-map"></div></div></div>
    </div>`;
}

function renderEventRow(ev, di) {
  if (editingEventId === ev.id) return renderEventEditForm(ev, di);
  return `
    <div class="event-row">
      <div class="event-row-actions">
        <button class="btn-icon" onclick="startEditEvent('${esc(ev.id)}',${di})">✏️</button>
        <button class="btn-icon" onclick="deleteEvent('${esc(ev.id)}',${di})" style="color:var(--coral)">🗑️</button>
      </div>
      <div class="event-time">${esc(ev.time||'')}</div>
      <div class="event-type-icon">${TYPE_ICON[ev.type]||'📌'}</div>
      <div class="event-body">
        <div class="event-type-tag">${esc(ev.type||'')}</div>
        <div class="event-name">${esc(ev.name||'')}</div>
        ${ev.desc ? `<div class="event-desc">${esc(ev.desc)}</div>` : ''}
        ${(ev.places||[]).length ? `<div class="event-places">${ev.places.map(p => 
          `<span class="place-chip" onclick="openPlace('${esc(p)}')">📍 ${esc(p)}</span>`).join('')}</div>` : ''}
      </div>
    </div>`;
}

function renderEventEditForm(ev, di) {
  const typeOpts = ALL_TYPES.map(t => `<option value="${esc(t)}" ${t === ev.type ? 'selected' : ''}>${esc(t)}</option>`).join('');
  return `
    <div class="event-row editing">
      <div class="edit-grid-3">
        <div class="edit-field"><label>時間</label><input type="text" id="ef-time" value="${esc(ev.time||'')}"></div>
        <div class="edit-field"><label>類型</label><select id="ef-type">${typeOpts}</select></div>
        <div class="edit-field"><label>名稱</label><input type="text" id="ef-name" value="${esc(ev.name||'')}"></div>
      </div>
      <div class="edit-grid">
        <div class="edit-field full"><label>說明備註</label><textarea id="ef-desc">${esc(ev.desc||'')}</textarea></div>
      </div>
      <div class="edit-field full"><label>地點標籤 (逗號分隔)</label><input type="text" id="ef-places" value="${esc((ev.places||[]).join(','))}"></div>
      <div class="edit-actions">
        <button class="btn-cancel" onclick="cancelEditEvent()">取消</button>
        <button class="btn-save" onclick="saveEditEvent('${esc(ev.id)}',${di})">儲存</button>
      </div>
    </div>`;
}

// ─── 編輯邏輯 CRUD ──────────────────────────────────────────
function switchTab(tab) {
  activeTab = tab;
  renderApp();
  if(tab === 'map') setTimeout(initMainMap, 100);
}

function openEditTripInfo() {
  document.getElementById('edit-trip-name').value = activeTrip.name;
  document.getElementById('edit-trip-start').value = activeTrip.start;
  document.getElementById('edit-trip-end').value = activeTrip.end;
  document.getElementById('modal-edit-trip').classList.add('open');
}
function saveTripInfo() {
  activeTrip.name = document.getElementById('edit-trip-name').value;
  activeTrip.start = document.getElementById('edit-trip-start').value;
  activeTrip.end = document.getElementById('edit-trip-end').value;
  closeModal('modal-edit-trip'); renderApp();
}

function addDay() {
  const n = (activeTrip.days.length) + 1;
  activeTrip.days.push({ label:`Day ${n}`, date:'', title:'新的一天', events:[] });
  renderApp();
}
function deleteDay(di) {
  if (confirm(`確定要刪除第 ${di+1} 天嗎？`)) { activeTrip.days.splice(di, 1); renderApp(); }
}
function startEditDayTitle(di) {
  const titleEl = document.getElementById('day-title-'+di);
  titleEl.outerHTML = `<input class="day-title-input" id="day-title-input-${di}" value="${esc(activeTrip.days[di].title)}" onblur="saveDayTitle(${di})">`;
  document.getElementById('day-title-input-'+di).focus();
}
function saveDayTitle(di) {
  const val = document.getElementById('day-title-input-'+di).value;
  activeTrip.days[di].title = val; renderApp();
}

function addEvent(di) {
  const newEv = { id: uid(), time:'10:00 - 11:00', type:'景點', name:'新行程', desc:'', places:[] };
  activeTrip.days[di].events.push(newEv);
  editingEventId = newEv.id; renderApp();
}
function startEditEvent(evId, di) { editingEventId = evId; renderApp(); }
function cancelEditEvent() { editingEventId = null; renderApp(); }
function deleteEvent(evId, di) {
  if(confirm('確定刪除此行程？')) { activeTrip.days[di].events = activeTrip.days[di].events.filter(e => e.id !== evId); renderApp(); }
}
function saveEditEvent(evId, di) {
  const ev = activeTrip.days[di].events.find(e => e.id === evId);
  ev.time = document.getElementById('ef-time').value;
  ev.type = document.getElementById('ef-type').value;
  ev.name = document.getElementById('ef-name').value;
  ev.desc = document.getElementById('ef-desc').value;
  ev.places = document.getElementById('ef-places').value.split(',').map(s=>s.trim()).filter(Boolean);
  editingEventId = null; renderApp();
}

function createTrip() {
  const today = new Date().toISOString().slice(0, 10);
  const trip = normalizeTrip({
    id: uid(),
    name: "新的旅遊規劃",
    flag: "🌏",
    start: today,
    end: "",
    days: [
      { label: "Day 1", date: "", title: "新的一天", events: [] }
    ]
  });
  trips.unshift(trip);
  activeTrip = trip;
  activeTripId = trip.id;
  activeTab = "itinerary";
  renderApp();
  openEditTripInfo();
}

function openTextPlan() {
  document.getElementById('text-plan-input').value = exportTextPlan(activeTrip);
  document.getElementById('text-plan-status').textContent = "";
  document.getElementById('modal-text-plan').classList.add('open');
}

function exportTextPlan(trip) {
  return JSON.stringify({
    name: trip.name || "",
    flag: trip.flag || "🌏",
    start: trip.start || "",
    end: trip.end || "",
    days: (trip.days || []).map(day => ({
      label: day.label || "",
      date: day.date || "",
      title: day.title || "",
      events: (day.events || []).map(event => ({
        time: event.time || "",
        type: event.type || "活動",
        name: event.name || "",
        desc: event.desc || "",
        places: event.places || []
      }))
    }))
  }, null, 2);
}

function parseTextPlan(rawText) {
  const data = JSON.parse(rawText);
  if (!data || typeof data !== "object") throw new Error("內容不是有效的 JSON。");

  const sourceDays = Array.isArray(data.days) ? data.days : [];
  const trip = normalizeTrip({
    id: activeTrip.id,
    name: data.name || data.tripName || activeTrip.name,
    flag: data.flag || activeTrip.flag || "🌏",
    start: data.start || data.startDate || activeTrip.start || "",
    end: data.end || data.endDate || activeTrip.end || "",
    days: sourceDays.map((day, index) => ({
      label: day.label || `Day ${index + 1}`,
      date: day.date || "",
      title: day.title || day.city || `Day ${index + 1}`,
      events: (Array.isArray(day.events) ? day.events : (Array.isArray(day.items) ? day.items : [])).map(item => ({
        id: item.id || uid(),
        time: item.time || "",
        type: item.type || item.category || "活動",
        name: item.name || item.title || "",
        desc: item.desc || item.notes || item.communication || "",
        places: Array.isArray(item.places) ? item.places : (item.location ? [item.location] : [])
      }))
    }))
  });

  if (!trip.days.length) throw new Error("找不到 days 陣列。");
  return trip;
}

async function copyTextPlan() {
  const input = document.getElementById('text-plan-input');
  input.value = exportTextPlan(activeTrip);
  await navigator.clipboard.writeText(input.value);
  document.getElementById('text-plan-status').textContent = "已複製，可以貼給 AI 修改。";
}

function downloadTextPlan() {
  const blob = new Blob([exportTextPlan(activeTrip)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = `${activeTrip.name || 'travel-plan'}.json`;
  link.click();
  URL.revokeObjectURL(url);
}

function applyTextPlan() {
  const status = document.getElementById('text-plan-status');
  try {
    const imported = parseTextPlan(document.getElementById('text-plan-input').value);
    const index = trips.findIndex(t => t.id === activeTripId);
    trips[index] = imported;
    activeTrip = imported;
    activeTripId = imported.id;
    editingEventId = null;
    closeModal('modal-text-plan');
    renderApp();
  } catch (error) {
    status.textContent = `匯入失敗：${error.message}`;
  }
}

document.getElementById('text-plan-file').addEventListener('change', async (event) => {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('text-plan-input').value = await file.text();
  document.getElementById('text-plan-status').textContent = "文字檔已載入，確認內容後按「套用文字計畫」。";
});

// ─── Leaflet 地圖 ──────────────────────────────────────────
function initMainMap() {
  if (mainMapInstance) { mainMapInstance.invalidateSize(); return; }
  mainMapInstance = L.map('main-map').setView([35.1578, 129.0591], 11); // 以西面為預設中心
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '&copy; OpenStreetMap' }).addTo(mainMapInstance);

  const bounds = [];
  activeTrip.days.forEach(day => {
    day.events.forEach(ev => {
      (ev.places || []).forEach(pName => {
        const p = PLACES_DB[pName];
        if(p && p.lat) {
          L.marker([p.lat, p.lng]).addTo(mainMapInstance).bindPopup(`<b>${pName}</b><br>${p.type}`);
          bounds.push([p.lat, p.lng]);
        }
      });
    });
  });
  if(bounds.length > 0) mainMapInstance.fitBounds(bounds, { padding: [30, 30] });
}

function openPlace(name) {
  const p = PLACES_DB[name] || { type: "未收錄", addr: "自訂地點，無座標", lat: 35.1578, lng: 129.0591 };
  document.getElementById('place-modal-type').textContent = p.type;
  document.getElementById('place-modal-name').textContent = name;
  document.getElementById('place-modal-address').textContent = p.addr;
  document.getElementById('place-modal-gmaps').href = `https://www.google.com/maps/search/?api=1&query=${p.lat},${p.lng}`;
  document.getElementById('modal-place').classList.add('open');

  setTimeout(() => {
    if(!modalMapInstance) {
      modalMapInstance = L.map('place-modal-map').setView([p.lat, p.lng], 15);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(modalMapInstance);
      modalMarker = L.marker([p.lat, p.lng]).addTo(modalMapInstance);
    } else {
      modalMapInstance.setView([p.lat, p.lng], 15);
      modalMarker.setLatLng([p.lat, p.lng]);
      modalMapInstance.invalidateSize();
    }
  }, 200);
}
function closePlaceModal() { document.getElementById('modal-place').classList.remove('open'); }

// 啟動
renderApp();
</script>
